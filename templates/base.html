
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusConnect</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>


<style>
    :root {
        --campus-maroon: #800000;
    }

    body {
        background-color: #f8f0f0 !important;
    }

    .navbar {
        background-color: var(--campus-maroon) !important;
    }

    .btn-success {
        background-color: var(--campus-maroon);
        border-color: var(--campus-maroon);
    }

    .btn-success:hover {
        background-color: #600000;
        border-color: #600000;
    }

    .text-success {
        color: var(--campus-maroon) !important;
    }

    a {
        color: var(--campus-maroon);
    }

    a:hover {
        color: #600000;
    }
</style>


<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-success">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'dashboard' %}">
                CampusConnect
            </a>

            <div class="d-flex align-items-center gap-3">
                {% if user.is_authenticated %}
                    <span class="text-white">
                        Hi, {{ user.username }}!
                    </span>

                    <form method="post" action="{% url 'logout' %}">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-light btn-sm">
                            Log out
                        </button>
                    </form>
                {% else %}
                    <a href="{% url 'login' %}" class="btn btn-outline-light btn-sm">
                        Log in
                    </a>

                    <a href="{% url 'signup' %}" class="btn btn-light btn-sm">
                        Sign up
                    </a>
                {% endif %}
            </div>
        </div>
    </nav>

    <main class="container py-5">

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-success" role="alert">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        {% block content %}
        {% endblock %}

    </main>

    <!-- Bootstrap 5 JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
